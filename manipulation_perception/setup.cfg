# Responsibility: Define strict lint and import-order policy for shared perception modules.
[flake8]
max-line-length = 120
application-import-names = manipulation_perception
import-order-style = google
# Keep the official ament_flake8 exceptions. Q000 is the sole package-specific
# exception: PEP 8 does not mandate a quote character, and mechanically changing
# thousands of operator-facing strings would add migration noise without
# changing the ROS contract.
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,Q000
