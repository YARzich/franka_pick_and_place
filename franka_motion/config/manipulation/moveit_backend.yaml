# Responsibility: Configure the V2 MoveIt planning and trajectory backend policy.
# Does not own: task stages, physical command deadlines, robot links, or ROS discovery policy.
/**/franka_transfer_object_sequence_server:
  ros__parameters:
    moveit.move_group_action: /move_action
    moveit.execute_trajectory_action: /execute_trajectory
    moveit.planning_pipeline: ompl
    moveit.planner_id: ""
    moveit.velocity_scaling: 0.2
    moveit.acceleration_scaling: 0.2
    moveit.position_tolerance: 0.001
    moveit.orientation_tolerance: 0.02
    moveit.joint_tolerance: 0.01
