# Responsibility: Select and tune the Panda arm inverse-kinematics solver.
# Adapted from moveit_resources_panda_moveit_config (BSD-3-Clause).
# KDL solves poses expressed for the panda_arm chain in the robot model frame.
panda_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
