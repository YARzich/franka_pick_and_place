# Responsibility: Apply conservative MoveIt motion limits and bounded shape-TF lookup.
# Adapted from moveit_resources_panda_moveit_config (BSD-3-Clause).
# Conservative MoveIt limits. Position and effort limits remain owned by URDF.
# Revolute values use rad/s, rad/s^2 and rad/s^3; prismatic finger values use
# the corresponding SI linear units.
# MoveIt 2.12 waits only 0.05 s by default. A larger bounded wait lets its
# independent TF buffer receive the same exact-stamp transforms admitted by
# moveit_octomap_tf_gate before the robot self-filter runs.
shape_transform_cache_lookup_wait_time: 0.5
