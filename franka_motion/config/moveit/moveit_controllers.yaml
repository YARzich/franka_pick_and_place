# Responsibility: Bind MoveIt trajectory execution to the canonical arm controller.
# Adapted from moveit_resources_panda_moveit_config (BSD-3-Clause).
# MoveIt sends arm trajectories through the ros2_control action server.
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01
  execution_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - panda_arm_controller

  panda_arm_controller:
    # Relative namespace resolves to /panda_arm_controller/follow_joint_trajectory
    # and remains compatible with node namespaces and ROS remapping.
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
