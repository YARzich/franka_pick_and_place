# Responsibility: Configure the optional Panda MoveIt Servo backend and controller binding.
# Does not own: ServoToPose action lifecycle, resource arbitration, or stop proof.
thread_priority: 40
publish_period: 0.01
max_expected_latency: 0.1
move_group_name: panda_arm

# Stable private ROS API exposed under /servo_node.
pose_command_in_topic: ~/pose_target_cmds
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
status_topic: ~/status
command_out_topic: /panda_arm_controller/joint_trajectory
joint_topic: /joint_states

command_in_type: speed_units
scale:
  linear: 0.2
  rotational: 0.8
  joint: 0.5
incoming_command_timeout: 0.1
apply_twist_commands_about_ee_frame: true
pose_tracking:
  # Backend thresholds mirror the action completion policy; a test guards drift.
  linear_tolerance: 0.001
  angular_tolerance: 0.01

command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

# move_group remains the authoritative PlanningScene owner.
monitored_planning_scene_topic: /planning_scene
is_primary_planning_scene_monitor: false
check_octomap_collisions: false
use_smoothing: true
smoothing_filter_plugin_name: online_signal_smoothing::AccelerationLimitedPlugin

check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
leaving_singularity_threshold_multiplier: 2.0
singularity_step_scale: 0.01
halt_all_joints_in_joint_mode: true
halt_all_joints_in_cartesian_mode: true
joint_limit_margins: [0.12]
override_velocity_scaling_factor: 0.0
