# Responsibility: Compose canonical Panda controllers with Isaac update settings.
controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100
    switch_timeout: 15.0

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: position_controllers/JointGroupPositionController

panda_arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    allow_partial_joints_goal: false
    constraints:
      goal_time: 10.0
      stopped_velocity_tolerance: 0.01
      panda_joint1: {trajectory: 0.5, goal: 0.01}
      panda_joint2: {trajectory: 0.5, goal: 0.01}
      panda_joint3: {trajectory: 0.5, goal: 0.01}
      panda_joint4: {trajectory: 0.5, goal: 0.01}
      panda_joint5: {trajectory: 0.5, goal: 0.01}
      panda_joint6: {trajectory: 0.5, goal: 0.01}
      panda_joint7: {trajectory: 0.5, goal: 0.01}
    allow_nonzero_velocity_at_trajectory_end: true

panda_hand_controller:
  ros__parameters:
    joints:
      - panda_finger_joint1
      - panda_finger_joint2
    command_interfaces:
      - position
